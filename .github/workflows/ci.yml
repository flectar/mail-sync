name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check on the minimum supported Rust
        run: cargo check --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The final stage only copies files, so arm64 builds without emulation.
      - name: Build amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: mail-sync-server:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name sync -p 8080:8080 \
            -e FLECTAR_MAIL_SYNC_PUBLIC_URL=http://localhost:8080 mail-sync-server:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' sync)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' sync | grep -qx healthy
          curl --fail --silent http://localhost:8080/v1/info
          docker logs sync
      - name: Check the compose files
        working-directory: deploy
        env:
          SYNC_DOMAIN: sync.example.org
          LITESTREAM_ACCESS_KEY_ID: ci
          LITESTREAM_SECRET_ACCESS_KEY: ci
          LITESTREAM_BUCKET: ci
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.litestream.yaml config --quiet
      # Back up to a local volume, lose the database, and restore it.
      - name: Rehearse a Litestream restore
        working-directory: deploy
        env:
          SYNC_DOMAIN: sync.example.org
          LITESTREAM_ACCESS_KEY_ID: ci
          LITESTREAM_SECRET_ACCESS_KEY: ci
          LITESTREAM_BUCKET: ci
        run: |
          set -x
          docker tag mail-sync-server:ci ghcr.io/flectar/mail-sync-server:latest
          files="-p backup-test -f compose.yaml -f compose.litestream.yaml -f ci/compose.backup-test.yaml"
          docker compose $files up -d --wait sync litestream
          sleep 20
          docker compose $files logs litestream
          docker run --rm -v backup-test_backups:/backups busybox find /backups -type f | grep .
          docker compose $files down
          docker volume rm backup-test_sync-data
          docker compose $files up -d --wait sync
          docker compose $files logs restore | tee restore.log
          ! grep -qi "no matching backups" restore.log
          docker run --rm -v backup-test_sync-data:/data busybox ls -ln /data
          docker compose $files down -v
