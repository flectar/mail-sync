# Continuous backup of the database to S3-compatible storage with
# Litestream (https://litestream.io). Use it on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.litestream.yaml up -d
#
# See docs/SELF-HOSTING.md for the variables.

x-litestream: &litestream
  image: litestream/litestream:0.5.14
  environment:
    LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:?set LITESTREAM_ACCESS_KEY_ID}
    LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:?set LITESTREAM_SECRET_ACCESS_KEY}
    LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:?set LITESTREAM_BUCKET}
    LITESTREAM_PATH: ${LITESTREAM_PATH:-flectar-mail-sync/sync.db}
    # Leave empty for AWS S3; set for other S3-compatible storage.
    LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
    LITESTREAM_REGION: ${LITESTREAM_REGION:-us-east-1}
  volumes:
    - sync-data:/data
    - ./litestream.yml:/etc/litestream.yml:ro

services:
  # On an empty volume, restore the newest backup before the server starts.
  # A fresh volume belongs to root, so hand it to the server's user.
  restore:
    <<: *litestream
    entrypoint: ["/bin/sh", "-c"]
    command:
      - litestream restore -if-db-not-exists -if-replica-exists /data/sync.db && chown -R 65532:65532 /data

  sync:
    depends_on:
      restore:
        condition: service_completed_successfully

  # Runs as the server's user, so the files it creates next to the
  # database stay writable by the server.
  litestream:
    <<: *litestream
    restart: unless-stopped
    user: "65532:65532"
    command: replicate
    depends_on:
      sync:
        condition: service_healthy
